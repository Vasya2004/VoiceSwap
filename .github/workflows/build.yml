name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate scripts and plists
        run: ./scripts/check.sh
      - name: Swift self-tests
        run: swift run -c debug --package-path swift Parakey --self-test all
      - name: Build app bundle
        run: SIGN_IDENTITY=- ./scripts/build-app.sh "$RUNNER_TEMP/VoiceSwap.app"
      - name: Verify app bundle
        run: |
          test -x "$RUNNER_TEMP/VoiceSwap.app/Contents/MacOS/SuperDictate"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/VoiceSwap.app/Contents/Info.plist")" = "com.vasya2004.voiceswap"
          codesign --verify --deep --strict "$RUNNER_TEMP/VoiceSwap.app"
      - name: Exercise VoiceSwap installer
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VoiceSwap.app" "$RUNNER_TEMP/release/VoiceSwap.zip"
          shasum -a 256 "$RUNNER_TEMP/release/VoiceSwap.zip" > "$RUNNER_TEMP/release/VoiceSwap.zip.sha256"
          VOICESWAP_ARCHIVE_URL="file://$RUNNER_TEMP/release/VoiceSwap.zip" \
          VOICESWAP_CHECKSUM_URL="file://$RUNNER_TEMP/release/VoiceSwap.zip.sha256" \
            ./install-voiceswap.sh
          test -x /Applications/VoiceSwap.app/Contents/MacOS/SuperDictate
          codesign --verify --deep --strict /Applications/VoiceSwap.app
