name: release smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    steps:
      - name: Install from the public command
        run: |
          curl -fsSL https://raw.githubusercontent.com/Vasya2004/VoiceSwap/main/install-voiceswap.sh | bash
      - name: Verify installed release
        run: |
          test -x /Applications/VoiceSwap.app/Contents/MacOS/SuperDictate
          test "$(plutil -extract CFBundleIdentifier raw -o - /Applications/VoiceSwap.app/Contents/Info.plist)" = "com.vasya2004.voiceswap"
          file /Applications/VoiceSwap.app/Contents/MacOS/SuperDictate | grep -q arm64
          codesign --verify --deep --strict /Applications/VoiceSwap.app
          codesign -d --entitlements :- /Applications/VoiceSwap.app > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/entitlements.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.microphone' "$RUNNER_TEMP/entitlements.plist")" = "true"
